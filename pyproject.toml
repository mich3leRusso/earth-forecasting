[project]
name = "earth-forecasting"
version = "0.1.0"
description = "Satellite nowcasting over Ireland with NVIDIA StormScope, fine-tuned with LoRA"
readme = "README.md"
authors = [
    { name = "mich3leRusso", email = "michele00russo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "apache-tvm-ffi<0.1.12",
    "cartopy>=0.26.0",
    "earth2studio",
    "eumdac>=3.1.0",
    "graphviz>=0.21",
    "huggingface-hub>=1.33.0",
    "mamba-ssm",
    "matplotlib>=3.11.2",
    "natten>=0.21.7",
    "nvidia-physicsnemo>=2.1.0",
    "omegaconf>=2.3.0",
    "tensorboard>=2.21.0",
    "torchview>=0.2.7",
    "transformers>=4.45",
]

[project.scripts]
earth-forecasting = "earth_forecasting.forecast:main"
earth-download = "earth_forecasting.data:main"
earth-train = "earth_forecasting.train:main"
earth-publish = "earth_forecasting.hub:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
earth2studio = { git = "https://github.com/NVIDIA/earth2studio.git", rev = "0.19.0" }
mamba-ssm = { git = "https://github.com/state-spaces/mamba" }

[tool.uv.extra-build-dependencies]
mamba-ssm = ["torch"]

[tool.uv.extra-build-variables]
mamba-ssm = { MAMBA_SKIP_CUDA_BUILD = "TRUE" }
