[project]
name = "earth-forecasting"
version = "0.1.0"
description = "Satellite nowcasting over Ireland with NVIDIA StormScope, fine-tuned with LoRA"
readme = "README.md"
authors = [
    { name = "mich3leRusso", email = "michele00russo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "earth2studio",
    "eumdac>=3.1.0",                 # EUMETSAT client used by earth2studio's MeteosatFCI
    "huggingface-hub>=1.33.0",
    "matplotlib>=3.11.2",
    "natten>=0.21.7",                # StormScope's neighborhood attention, via physicsnemo
    "nvidia-physicsnemo>=2.1.0",
    "omegaconf>=2.3.0",
    "tensorboard>=2.21.0",           # backend of torch.utils.tensorboard
]

[project.scripts]
earth = "earth_forecasting.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
earth2studio = { git = "https://github.com/NVIDIA/earth2studio.git", rev = "0.19.0" }

[dependency-groups]
dev = [
    "graphviz>=0.21",
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "torchview>=0.2.7",
]
